<!doctype html>
<meta charset="utf-8">
<!--
  3D 모션을 그림 여러 장으로 굽는 페이지.

  헤드리스 크롬이 이 페이지를 열고 화면을 찍으면 스프라이트 시트 한 장이 나온다
  (`tools/bake-sprites.py` 가 시킨다). 판에서 쓰는 그리기 설정 - 직교 카메라,
  MeshBasicMaterial, 높이 1 정규화, 비율 보정 - 을 `src/ui/art` 쪽과 똑같이
  맞춰야 구운 그림이 실시간 3D 와 같은 모습이 된다.
-->
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  canvas { display: block; }
</style>
<canvas id="sheet"></canvas>
<!-- GLTFLoader 안에서 'three' 를 그대로 부른다. 이름을 실제 파일로 이어 준다 -->
<script type="importmap">
{
  "imports": {
    "three": "../../node_modules/three/build/three.module.js",
    "three/": "../../node_modules/three/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';

const q = new URLSearchParams(location.search);
const dir = q.get('dir');                       // 예: ../../assets/units/mochi
const motions = (q.get('motions') || 'idle').split(',');
const frames = Number(q.get('frames') || 12);
const size = Number(q.get('size') || 192);      // 한 칸의 픽셀
const cols = Number(q.get('cols') || frames);   // 한 줄에 몇 장. 장수가 많으면 접어서 격자로 굽는다
const turn = Number(q.get('turn') || 0);        // 0 이면 정면, 0.5π 면 오른쪽
const shape = {
  torso: Number(q.get('torso') || 1),
  belly: Number(q.get('belly') || 1),
  head: Number(q.get('head') || 1),
};
const SS = 2;                                   // 두 배로 그려서 줄인다 (가장자리가 곱게 나온다)

function readFile(path) {
  return new Promise((ok, no) => {
    const x = new XMLHttpRequest();
    x.open('GET', path);
    x.responseType = 'arraybuffer';
    x.onload = () => ok(x.response);
    x.onerror = () => no(new Error('못 읽음: ' + path));
    x.send();
  });
}

/** GLB 를 열어 모델과, 뒤에 붙여 둔 날 것 텍스처를 꺼낸다 (`src/ui/art/gl.ts` 와 같은 방식) */
async function loadModel(path) {
  const buf = await readFile(path);
  const view = new DataView(buf);
  let at = 12, json = {}, binAt = 0;
  while (at < buf.byteLength) {
    const len = view.getUint32(at, true);
    const kind = view.getUint32(at + 4, true);
    at += 8;
    if (kind === 0x4e4f534a) json = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, at, len)));
    else binAt = at;
    at += len;
  }
  const mark = json.extras && json.extras.skin;
  let skin = null;
  if (mark) {
    const bv = json.bufferViews[mark.bufferView];
    skin = new THREE.DataTexture(
      new Uint8Array(buf, binAt + bv.byteOffset, bv.byteLength),
      mark.width, mark.height, THREE.RGBAFormat);
    skin.colorSpace = THREE.SRGBColorSpace;
    skin.flipY = false;
    skin.needsUpdate = true;
  }
  const gltf = await new GLTFLoader().parseAsync(buf, '');
  return { gltf, skin };
}

/** 같은 이름으로 두 개가 오는데 짧은 쪽은 기본 자세 한 프레임이다 */
const pickClip = (clips) => clips.reduce((a, b) => (b.duration > a.duration ? b : a));

// --- 아래 둘은 src/ui/art/gl.ts 에서 그대로 옮겨 왔다. 고치면 양쪽을 같이 고칠 것 ---
function reshape(model, clips, { torso = 1, belly = 1, head = 1 }) {
  if (torso === 1 && belly === 1 && head === 1) return;
  const isSpine = (n) => /^spine/i.test(n);
  const isHead = (n) => /^head$/i.test(n);
  const chain = [];
  model.traverse((o) => { if (o.isBone && isSpine(o.name)) chain.push(o); });
  const depth = (b) => { let n = 0; for (let p = b.parent; p; p = p.parent) if (isSpine(p.name)) n += 1; return n; };
  chain.sort((a, b) => depth(a) - depth(b));
  const wider = chain[0] ? chain[0].name : '';
  const back = chain.length > 1 ? chain[chain.length - 1].name : '';
  model.traverse((o) => {
    if (!o.isBone) return;
    if (isSpine(o.name)) o.position.y *= torso;
    if (o.name === wider) { o.scale.x *= belly; o.scale.z *= belly; }
    if (o.name === back) { o.scale.x /= belly; o.scale.z /= belly; }
    if (isHead(o.name)) o.scale.multiplyScalar(head);
  });
  for (const clip of clips) {
    for (const track of clip.tracks) {
      const [bone, prop] = track.name.split('.');
      if (prop === 'position' && isSpine(bone)) {
        for (let i = 1; i < track.values.length; i += 3) track.values[i] *= torso;
      } else if (prop === 'scale') {
        const s = bone === wider ? [belly, 1, belly]
          : bone === back ? [1 / belly, 1, 1 / belly]
          : isHead(bone) ? [head, head, head] : [1, 1, 1];
        if (s[0] === 1 && s[1] === 1 && s[2] === 1) continue;
        for (let i = 0; i < track.values.length; i += 3) {
          track.values[i] *= s[0]; track.values[i + 1] *= s[1]; track.values[i + 2] *= s[2];
        }
      }
    }
  }
}

function stripRootMotion(model, clip) {
  const mesh = model.getObjectByProperty('type', 'SkinnedMesh');
  const root = mesh && mesh.skeleton && mesh.skeleton.bones[0] && mesh.skeleton.bones[0].name;
  if (root) clip.tracks = clip.tracks.filter((t) => t.name !== `${root}.position`);
}

async function main() {
  const { gltf, skin } = await loadModel(`${dir}/${motions[0]}.glb`);
  /*
    조명 없이 텍스처만 보여 준다 - 판에서 쓰는 방식(MeshBasicMaterial)과 같다.

    meshy 에서 바로 받은 GLB 는 빛을 받아야 보이는 재질(MeshStandardMaterial)로
    오는데, 이 장면에는 조명이 없어서 그대로 두면 새까맣게 구워진다. 우리
    `shrink-glb.py --strip` 을 거친 GLB 는 텍스처가 따로 떼여 있어(`extras.skin`)
    그걸 쓰고, 원본은 재질에 붙어 있는 텍스처를 그대로 가져온다.
  */
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    const map = skin || (o.material && o.material.map) || null;
    o.material = new THREE.MeshBasicMaterial({ map });
  });

  const clips = {};
  clips[motions[0]] = pickClip(gltf.animations);
  for (const m of motions.slice(1)) {
    clips[m] = pickClip((await loadModel(`${dir}/${m}.glb`)).gltf.animations);
  }
  const list = Object.values(clips);
  for (const c of list) stripRootMotion(gltf.scene, c);
  reshape(gltf.scene, list, shape);

  // 높이를 1 로 맞추고 발밑을 0 에 둔다 (BoardModels 와 같은 방식)
  const node = gltf.scene;
  const box = new THREE.Box3().setFromObject(node);
  const span = box.getSize(new THREE.Vector3());
  const fix = new THREE.Group();
  node.position.set(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2);
  node.scale.setScalar(1 / span.y);
  node.position.multiplyScalar(1 / span.y);
  fix.add(node);
  fix.rotation.y = turn;

  const px = size * SS;
  const scene = new THREE.Scene();
  scene.add(fix);
  const camera = new THREE.OrthographicCamera(-px / 2, px / 2, px / 2, -px / 2, -500, 500);
  camera.position.z = 100;
  // 한 칸을 꽉 채우되 위아래에 여백을 조금 남긴다
  fix.scale.setScalar(px * 0.86);
  fix.position.set(0, -px * 0.45, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(px, px, false);
  renderer.setClearAlpha(0);

  /*
    장수가 많으면 가로로만 늘어놓을 수 없다 - 그림 한 변이 4096 을 넘으면
    기기가 못 올린다. 한 줄에 cols 장씩 접어서 격자로 굽고, 동작마다 새 줄에서
    시작한다. 읽는 쪽(`sprite.tsx`)이 같은 규칙으로 찾아간다.
  */
  const rowsPer = Math.ceil(frames / cols);
  const sheet = document.getElementById('sheet');
  sheet.width = size * cols;
  sheet.height = size * rowsPer * motions.length;
  const ctx = sheet.getContext('2d');

  const mixer = new THREE.AnimationMixer(node);
  motions.forEach((m, row) => {
    const act = mixer.clipAction(clips[m]);
    mixer.stopAllAction();
    act.play();
    for (let i = 0; i < frames; i += 1) {
      mixer.setTime((clips[m].duration * i) / frames);
      renderer.render(scene, camera);
      const gx = i % cols;
      const gy = row * rowsPer + Math.floor(i / cols);
      ctx.drawImage(renderer.domElement, gx * size, gy * size, size, size);
    }
  });
  document.title = 'done';
}

main().catch((e) => { document.title = 'error: ' + e.message; });
</script>
